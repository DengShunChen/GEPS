stages:
  - build
  - deploy
  - test

dev-build:
  stage: build
  only:
    - development
    - cicd
  script:
    - echo "dev build"
    - hostname ; pwd
    - ./compile fx1000
    - ./compile a100

dev-deploy:
  stage: deploy
  only:
    - development
    - cicd
  script:
    - echo "dev deploy"

dev-test:
  stage: test
  only:
    - development
    - cicd
  script:
    - echo "dev testing"
    - cd job
    - JID=$(pjsub -z jid TCo383L72_IC_sample_fx1000)
    - /usr/bin/pjwait ${JID}

stg-build:
  stage: build
  only:
    - master
  script:
    - echo "stg build"
    - hostname ; pwd
    - ./compile

stg-deploy:
  stage: deploy
  only:
    - master
  script:
    - echo "stg deploy"

stg-test:
  stage: test
  only:
    - master
  script:
    - echo "stg testing"
